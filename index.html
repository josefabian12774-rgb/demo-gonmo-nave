<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GONMO NAVE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap');
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-purple-glow { box-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        .neon-amber-glow { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        .neon-cyan-glow { box-shadow: 0 0 25px rgba(34, 211, 238, 0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <div id="root" class="w-full flex-1 flex flex-col"></div>

    <script type="text/babel">
        function GonmoNaveApp() {
            const datosPantalla = {
                zonaAlpha: [
                    { id: 1, title: "NIGHTHAWK", spec: "PRD-OPTIC SENSOR", detail: "18K DPI", badge: "⚡", img: "🖱️" },
                    { id: 2, title: "TITAN RDX", spec: "12GB GDDR6", detail: "RAY TRACING", badge: "»", img: "📟" }
                ],
                zonaPractica: [
                    { id: 3, title: "POWER-DRILL 18V", spec: "TEOMKL 33SO H3", detail: "POWER MOTOR DOSWM", label: "18V", img: "⚙️" },
                    { id: 4, title: "AMBI-LIGHT", spec: "🌐 WIFI", detail: "🔋 ARP CONTROL", subdetail: "⚙️ SCENE PRESETS", img: "💡" }
                ],
                agente: {
                    name: "ASTRO-GDNMO",
                    message: "¡Hola! ¿Buscás potenciar tu setup o equipar tu hogar?"
                }
            };

            return (
                <div class="flex-1 flex flex-col bg-gradient-to-b from-[#0d111c] to-[#07090e] pb-24">
                    
                    {/* BARRA SUPERIOR NAV */}
                    <header class="w-full flex items-center justify-between px-6 py-4 border-b border-slate-800/60 bg-[#0f1422]/80 backdrop-blur-md">
                        <div class="flex items-center space-x-3">
                            <i class="bi bi-list text-2xl text-slate-400 cursor-pointer"></i>
                            <span class="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 font-orbitron">GONMO NAVE</span>
                        </div>
                        <div class="flex items-center space-x-5 text-slate-400 text-xl">
                            <i class="bi bi-person cursor-pointer hover:text-white"></i>
                            <i class="bi bi-search cursor-pointer hover:text-white"></i>
                            <div class="relative cursor-pointer">
                                <i class="bi bi-cart3 hover:text-white"></i>
                                <span class="absolute -top-2 -right-2 bg-red-500 text-white font-bold text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-orbitron">3</span>
                            </div>
                        </div>
                    </header>

                    {/* CONTENIDO EN DOS COLUMNAS */}
                    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 p-4 max-w-5xl mx-auto w-full items-start mt-2">
                        
                        {/* COLUMNA IZQUIERDA: ZONA ALPHA */}
                        <div class="space-y-4">
                            <h2 class="text-xl font-black tracking-wider text-cyan-400 font-orbitron pl-1">ZONA ALPHA</h2>
                            
                            {datosPantalla.zonaAlpha.map(item => (
                                <div key={item.id} class="relative bg-gradient-to-br from-[#13192b] to-[#0a0d16] border-2 border-purple-500/30 rounded-2xl p-4 flex items-center justify-between overflow-hidden neon-purple-glow">
                                    <div class="space-y-1">
                                        <h3 class="text-xl font-black font-orbitron tracking-wide text-slate-100">{item.title}</h3>
                                        <p class="text-xs text-purple-400/90 tracking-wider uppercase">{item.spec}</p>
                                        <p class="text-[11px] text-slate-400 font-mono">{item.detail}</p>
                                    </div>
                                    <div class="flex flex-col items-center justify-center bg-[#1c243f] w-16 h-16 rounded-xl border border-purple-500/20 text-3xl">
                                        {item.img}
                                    </div>
                                    <span class="absolute bottom-2 right-2 text-purple-400 font-bold bg-purple-950/50 px-2 py-0.5 rounded text-xs font-orbitron border border-purple-500/30">
                                        {item.badge}
                                    </span>
                                </div>
                            ))}
                        </div>

                        {/* COLUMNA DERECHA: ZONA PRÁCTICA */}
                        <div class="space-y-4">
                            <h2 class="text-xl font-black tracking-wider text-slate-400 font-orbitron pl-1 uppercase">ZONA PRÁCTICA</h2>
                            
                            {datosPantalla.zonaPractica.map(item => (
                                <div key={item.id} class="relative bg-gradient-to-br from-[#161a24] to-[#0e1118] border-2 border-amber-500/30 rounded-2xl p-4 flex items-center justify-between overflow-hidden neon-amber-glow">
                                    <div class="space-y-1">
                                        <div class="flex items-center space-x-2">
                                            <h3 class="text-xl font-black font-orbitron tracking-wide text-slate-200">{item.title}</h3>
                                            {item.label && <span class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-1.5 py-0.5 rounded border border-amber-500/40 font-orbitron">{item.label}</span>}
                                        </div>
                                        <p class="text-xs text-slate-400 font-mono">{item.spec}</p>
                                        <p class="text-[11px] text-amber-500/90 uppercase tracking-wide">{item.detail}</p>
                                        {item.subdetail && <p class="text-[10px] text-slate-500 font-mono">{item.subdetail}</p>}
                                    </div>
                                    <div class="flex flex-col items-center justify-center bg-[#222838] w-16 h-16 rounded-xl border border-amber-500/20 text-3xl">
                                        {item.img}
                                    </div>
                                    <span class="absolute bottom-2 right-2 text-amber-400 bg-amber-950/40 border border-amber-500/30 p-1 rounded-lg text-xs leading-none">
                                        <i class="bi bi-qr-code-scan"></i>
                                    </span>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* CENTRO: ROBOT FLOTANTE ASTRO-GDNMO */}
                    <div class="fixed inset-x-0 bottom-24 flex flex-col items-center justify-center pointer-events-none z-40 px-4">
                        <div class="bg-gradient-to-b from-[#162235] to-[#101926] border border-cyan-400/40 text-slate-200 rounded-2xl px-4 py-3 text-xs text-center max-w-xs shadow-2xl mb-3 pointer-events-auto relative">
                            <p class="text-cyan-400 font-black text-[10px] font-orbitron tracking-widest mb-1">{datosPantalla.agente.name}</p>
                            <p class="leading-relaxed font-semibold">{datosPantalla.agente.message}</p>
                            <div class="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#101926] border-r border-b border-cyan-400/40 rotate-45"></div>
                        </div>
                        
                        <div class="w-16 h-16 bg-gradient-to-b from-cyan-400 to-blue-600 rounded-full flex items-center justify-center text-3xl neon-cyan-glow border border-cyan-300 animate-bounce pointer-events-auto">
                            🤖
                        </div>
                    </div>

                    {/* BARRA INFERIOR */}
                    <nav class="fixed bottom-0 inset-x-0 bg-[#0c101d]/95 backdrop-blur-lg border-t border-slate-800/80 py-2 px-6 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center space-y-0.5 cursor-pointer text-cyan-400">
                            <i class="bi bi-cart-fill text-lg"></i>
                            <span class="text-[11px] font-bold tracking-wider uppercase font-orbitron">CARRITO</span>
                        </div>
                        <div class="flex flex-col items-center space-y-0.5 cursor-pointer hover:text-white transition-colors">
                            <i class="bi bi-person text-lg"></i>
                            <span class="text-[11px] font-medium tracking-wider uppercase">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center space-y-0.5 cursor-pointer hover:text-white transition-colors">
                            <i class="bi bi-bell text-lg"></i>
                            <span class="text-[11px] font-medium tracking-wider uppercase">NOTIFICACIONES</span>
                        </div>
                    </nav>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<GonmoNaveApp />);
    </script>
</body>
</html>
