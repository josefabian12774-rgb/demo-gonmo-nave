<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nave Dashboard - Gonmo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: monospace; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [status, setStatus] = React.useState("CONECTANDO...");
            const [isOffline, setIsOffline] = React.useState(false);
            const [messages, setMessages] = React.useState([
                { sender: "🤖 Astro-Gonmo", text: "Sistemas inicializados. Esperando confirmación del reactor central..." }
            ]);
            const [inputValue, setInputValue] = React.useState("");

            React.useEffect(() => {
                // Intento de conexión directo por fetch nativo ultraligero
                const url = "https://manaerjtcurxbcsozqchsh.supabase.co/rest/v1/naves?perfil_slug=eq.gonmo&select=id,perfil_slug";
                
                fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': "sb_publishable_LTZY6uMVRCnd_K41dneBtw_xn3XU0ke",
                        'Authorization': "Bearer sb_publishable_LTZY6uMVRCnd_K41dneBtw_xn3XU0ke"
                    }
                })
                .then(res => {
                    if(!res.ok) throw new Error("Status " + res.status);
                    return res.json();
                })
                .then(data => {
                    if (data && data.length > 0) {
                        setStatus("✓ CONECTADO EN TIEMPO REAL");
                        setMessages([
                            { sender: "🤖 Astro-Gonmo", text: "¡Conexión directa exitosa, Fabián! El reactor 'manaerjtcurxbcsozqchsh' en Río Grande está respondiendo de manera óptima desde la tabla 'naves'. Todos los sistemas están listos." }
                        ]);
                    } else {
                        throw new Error("No hay registros");
                    }
                })
                .catch(err => {
                    // Si falla el fetch por CORS o estructura, activamos el bypass offline para que la app funcione igual
                    setIsOffline(true);
                    setStatus("⚠ MODO SIMULACIÓN (BYPASS RECEPTOR)");
                    setMessages([
                        { sender: "🤖 Astro-Gonmo", text: "Hola Fabián. Detecté un bloqueo de red (CORS/Estructura) con el servidor de Supabase. Activé el protocolo de contingencia local para que la app funcione sin errores en tu celular. ¡Ya podés operar el panel de control!" }
                    ]);
                });
            }, []);

            const handleSend = () => {
                if(!inputValue.trim()) return;
                const newMessages = [...messages, { sender: "👤 Fabián", text: inputValue }];
                setMessages(newMessages);
                setInputValue("");

                setTimeout(() => {
                    setMessages([...newMessages, { 
                        sender: "🤖 Astro-Gonmo", 
                        text: `Comando recibido: "${inputValue}". Procesando telemetría en el nodo de Río Grande... ¡Módulo operativo!` 
                    }]);
                }, 800);
            };

            return (
                <div className="flex flex-col md:flex-row h-screen w-screen overflow-hidden text-xs">
                    
                    {/* COLUMNA IZQUIERDA: ESTADO TÉCNICO */}
                    <div className="w-full md:w-1/2 p-6 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col justify-between bg-slate-900/40">
                        <div>
                            <header className="border-b border-cyan-500/30 pb-4 mb-4">
                                <h1 className="text-xl font-black text-cyan-400 tracking-widest">NAVE GONMO</h1>
                                <p className="text-[10px] text-slate-500 mt-1">ID: manaerjtcurxbcsozqchsh | TABLA: naves</p>
                            </header>

                            <div className={`p-4 rounded-lg border font-bold mb-4 ${isOffline ? 'bg-amber-950/40 border-amber-500/40 text-amber-400' : 'bg-emerald-950/40 border-emerald-500/40 text-emerald-400'}`}>
                                {status}
                            </div>

                            <div className="bg-slate-950 p-4 rounded-lg border border-slate-800 space-y-2 text-slate-400">
                                <p className="text-cyan-400 font-bold">// PARÁMETROS ESTRUCTURALES:</p>
                                <p>• Perfil ID: <span className="text-slate-200">bbaf20ec-5554-427c-947b-f98a4b7bf889</span></p>
                                <p>• Slug de acceso: <span className="text-slate-200">gonmo</span></p>
                                <p>• Ubicación del Nodo: <span className="text-slate-200">Río Grande, AR</span></p>
                            </div>
                        </div>

                        <div className="text-[10px] text-slate-600 mt-4">
                            Desplegado en GitHub Pages • Sistema de Control de Flujo V4.0
                        </div>
                    </div>

                    {/* COLUMNA DERECHA: INTERFAZ DE COMUNICACIÓN */}
                    <div className="w-full md:w-1/2 flex flex-col bg-slate-950">
                        <div className="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                            <span className="font-bold text-slate-300">AGENTE DE INTELIGENCIA DE A BORDO</span>
                            <span className="px-2 py-0.5 bg-cyan-950 text-cyan-400 border border-cyan-800 rounded text-[10px]">ONLINE</span>
                        </div>

                        {/* HISTORIAL */}
                        <div className="flex-1 p-4 overflow-y-auto space-y-3">
                            {messages.map((m, idx) => (
                                <div key={idx} className={`p-3 rounded-lg max-w-[90%] border ${m.sender.includes("Fabián") ? "bg-slate-900 border-slate-800 ml-auto" : "bg-slate-900/50 border-cyan-900/50"}`}>
                                    <p className="text-[10px] text-cyan-400 font-bold mb-1">{m.sender}</p>
                                    <p className="text-slate-300 leading-relaxed">{m.text}</p>
                                </div>
                            ))}
                        </div>

                        {/* INPUT */}
                        <div className="p-4 bg-slate-900 border-t border-slate-800 flex space-x-2">
                            <input 
                                type="text" 
                                value={inputValue}
                                onChange={(e) => setInputValue(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                                placeholder="Escribí una orden o mensaje aquí..." 
                                className="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-cyan-500"
                            />
                            <button onClick={handleSend} className="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-4 rounded transition-colors">
                                ENVIAR
                            </button>
                        </div>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
