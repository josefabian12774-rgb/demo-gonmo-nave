<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nave Dashboard - Gonmo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // 1. URL de tu reactor de Supabase (termina en sh)
        const SUPABASE_URL = "https://manaerjtcurxbcsozqchsh.supabase.co";
        
        // 2. Tu llave pública exacta de la captura
        const SUPABASE_ANON_KEY = "sb_publishable_LTZY6uMVRCnd_K41dneBtw_xn3XU0ke"; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function NaveDashboard() {
            const [registroNave, setRegistroNave] = React.useState(null);
            const [loading, setLoading] = React.useState(true);
            const [errorMsg, setErrorMsg] = React.useState(null);

            React.useEffect(() => {
                async function cargarNave() {
                    try {
                        // Buscamos en la tabla 'naves' donde el perfil sea 'gonmo'
                        const { data, error } = await supabaseClient
                            .from('naves')
                            .select('*')
                            .eq('perfil_slug', 'gonmo')
                            .maybeSingle();

                        if (error) {
                            setErrorMsg("Error de Supabase: " + error.message);
                        } else if (data) {
                            setRegistroNave(data);
                        } else {
                            setErrorMsg("No se encontró ningún registro con perfil_slug 'gonmo'");
                        }
                    } catch (err) {
                        setErrorMsg("Error de conexión: " + err.message);
                    } finally {
                        setLoading(false);
                    }
                }
                cargarNave();
            }, []);

            if (loading) return <div className="flex h-screen items-center justify-center font-mono animate-pulse text-cyan-400 text-xl">CONECTANDO CON EL REACTOR DE LA NAVE...</div>;
            if (errorMsg) return <div className="flex h-screen flex-col items-center justify-center font-mono text-red-500 text-lg text-center p-4"><span>⚠️ ERROR DETECTADO</span><span className="text-xs text-slate-400 mt-2 bg-slate-900 p-2 rounded border border-slate-800">{errorMsg}</span></div>;

            // Extraemos configuraciones seguras por si la columna content está vacía
            const uiConfig = registroNave?.content?.ui_config || { nave_title: "NAVE GONMO", logo_id: "SÃO PAULO REACTOR" };
            const zones = registroNave?.content?.zones || { alpha_items: [], practica_items: [] };
            const aiBrain = registroNave?.content?.ai_brain || { agent_name: "Astro-Gonmo" };

            return (
                <div className="flex flex-col md:flex-row h-screen w-screen overflow-hidden">
                    
                    {/* SECCIÓN IZQUIERDA: CATÁLOGO DINÁMICO */}
                    <div className="w-full md:w-1/2 h-1/2 md:h-full overflow-y-auto border-b md:border-b-0 md:border-r border-slate-800 p-6 space-y-6">
                        <header className="border-b border-cyan-500/30 pb-4">
                            <h1 className="text-2xl font-black tracking-widest text-cyan-400">{uiConfig.nave_title}</h1>
                            <p className="text-xs text-slate-400 mt-1 font-mono">REACTOR ID: manaerjtcurxbcsozqchsh</p>
                        </header>

                        {/* Estado del Registro */}
                        <div className="bg-slate-900/60 border border-emerald-500/30 p-4 rounded-xl font-mono text-xs text-slate-300">
                            <p className="text-emerald-400 font-bold mb-1">✓ CONEXIÓN EXITOSA</p>
                            <p>Tabla apuntada: <span className="text-cyan-400">naves</span></p>
                            <p className="truncate">ID Fila: {registroNave?.id}</p>
                        </div>

                        {/* Listado de items (si existen en content) */}
                        {zones.alpha_items.length > 0 && (
                            <div>
                                <h2 className="text-lg font-bold text-amber-400 mb-3 tracking-wider">// ZONA ALPHA</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {zones.alpha_items.map(item => (
                                        <div key={item.id} className="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                                            <h3 className="font-bold text-base">{item.title}</h3>
                                            <p className="text-xs text-slate-400 mt-1">{item.description}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* SECCIÓN DERECHA: CHAT CON IA */}
                    <div className="w-full md:w-1/2 h-1/2 md:h-full flex flex-col bg-slate-950/40">
                        <div className="p-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping" />
                                <span className="font-mono font-bold text-slate-200">{aiBrain.agent_name}</span>
                            </div>
                            <span className="text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800 px-2 py-0.5 rounded font-mono">ONLINE</span>
                        </div>

                        {/* Historial del Chat */}
                        <div className="flex-1 p-4 overflow-y-auto space-y-4 font-mono text-xs">
                            <div className="bg-slate-900 border border-slate-800 p-3 rounded-xl max-w-[85%]">
                                <p className="text-cyan-400 text-[10px] mb-1">🤖 {aiBrain.agent_name}</p>
                                <p className="text-slate-300">¡Conexión establecida con la tabla naves, Fabián! El radar en Río Grande está encendido y operando sin errores de código. ¿Qué módulo querés activar ahora?</p>
                            </div>
                        </div>

                        {/* Input de Control */}
                        <div className="p-4 bg-slate-900 border-t border-slate-800">
                            <div className="flex space-x-2">
                                <input 
                                    type="text" 
                                    placeholder="Escribile al agente..." 
                                    className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono"
                                />
                                <button className="bg-cyan-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs font-mono">
                                    OK
                                </button>
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NaveDashboard />);
    </script>
</body>
</html>
