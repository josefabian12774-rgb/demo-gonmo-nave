<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;900&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #02040a; }
        .col-nave { height: calc(100vh - 128px); overflow-y: scroll; scroll-behavior: smooth; padding-top: 24px; }
        .col-nave::-webkit-scrollbar { display: none; }
        .silicon-alpha { background: radial-gradient(circle at 50% 50%, rgba(17, 28, 58, 0.6), #050914); }
        .silicon-practica { background: radial-gradient(circle at 50% 50%, #f1c40f, #b78a02); }
        .card-alpha { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); border: 2px solid rgba(6, 182, 212, 0.2); }
        .card-practica { background: #ffffff; border: 2px solid #1e293b; }
        .hologram-glow { animation: proyectorPulse 2s ease-in-out infinite; }
        @keyframes proyectorPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div id="root" class="w-full h-full"></div>
    <script type="text/babel">
        function App() {
            const [selected, setSelected] = React.useState(null);
            return (
                <div className="w-full h-full flex flex-col bg-slate-950 text-white">
                    <header className="h-16 w-full flex items-center justify-between px-4 border-b border-white/10 backdrop-blur-md">
                        <i className="bi bi-list text-xl"></i>
                        <div className="flex items-center space-x-2">
                            <img src="./logo.JPG" alt="GonMo" className="h-8 w-8 object-cover rounded-md border border-cyan-500/30 shadow-[0_0_10px_rgba(6,182,212,0.5)]" />
                            <span className="text-[10px] font-bold tracking-widest uppercase text-white/70">GONMO<br/><span className="text-cyan-400">NAVE</span></span>
                        </div>
                        <i className="bi bi-search text-lg"></i>
                    </header>
                    <main className="flex-1 flex relative overflow-hidden">
                        <div className="w-1/2 col-nave silicon-alpha px-2 border-r border-white/10">
                            <h2 className="text-[10px] font-bold text-cyan-400 text-center uppercase pb-4">// SILICIO ALPHA</h2>
                            <div className="card-alpha rounded-2xl p-4 h-32 mb-4 cursor-pointer" onClick={() => setSelected('ALPHA')}></div>
                        </div>
                        <div className="w-1/2 col-nave silicon-practica px-2">
                            <h2 className="text-[10px] font-bold text-slate-950 text-center uppercase pb-4">// SILICIO PRÁCTICA</h2>
                            <div className="card-practica rounded-2xl p-4 h-32 mb-4 cursor-pointer" onClick={() => setSelected('PRACTICA')}></div>
                        </div>
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-40">
                            <i className="bi bi-robot text-5xl text-cyan-400 hologram-glow"></i>
                        </div>
                    </main>
                    {selected && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4" onClick={() => setSelected(null)}>
                            <div className="bg-slate-900 p-6 rounded-3xl w-full max-w-sm border border-white/10">
                                <h2 className="text-xl font-bold uppercase mb-4">{selected}</h2>
                                <button className="w-full h-12 bg-cyan-500 rounded-xl font-bold text-slate-950" onClick={() => setSelected(null)}>CERRAR</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
