<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — CORRECCION PUSHUP V2.4</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }

        /* SCROLL INDEPENDIENTE FORZADO (Contenedores fijos aislados) */
        .col-nave {
            height: calc(100vh - 128px);
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        /* Deshabilitar barras visuales pero mantener el drag nativo */
        .col-nave::-webkit-scrollbar { display: none; }

        /* Estructura de Silicio Cian (Alpha) */
        .silicon-alpha {
            background-color: #060b19;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.07) 2px, transparent 2px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.07) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, rgba(17, 28, 58, 0.8), #050914);
            background-size: 20px 20px, 20px 20px, 100% 100%;
        }

        /* Estructura de Silicio Industrial (Práctica) */
        .silicon-practica {
            background-color: #eab308;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.07) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.07) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, #f4d03f, #ca8a04);
            background-size: 25px 25px, 25px 25px, 100% 100%;
        }

        /* Tarjetas de Silicio */
        .card-alpha-silicon {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border: 2px solid rgba(6, 182, 212, 0.2);
            box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.1), 0 12px 24px rgba(0,0,0,0.5);
        }
        .card-practica-silicon {
            background: #ffffff;
            border: 2px solid #0f172a;
            box-shadow: 4px 4px 0px #0f172a, 0 8px 16px rgba(0,0,0,0.15);
        }

        /* Eje Central exacto para el Avatar */
        .astro-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
        }

        /* PUSH-UP QUANTUM: REVENTANDO EL CENTRO DE LA PANTALLA */
        @keyframes pushUpCenter {
            0% { transform: scale(0.4) translateY(50px); opacity: 0; filter: blur(8px); }
            100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
        }
        .animate-quantum-center {
            animation: pushUpCenter 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="antialiased select-none text-white">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        function GonmoNaveSplit() {
            const [selectedProduct, setSelectedProduct] = React.useState(null);

            // Añadidos más elementos para garantizar que haya contenido suficiente para scrollear
            const productosAlpha = [
                { id: 1, title: "NIGHTHAWK", spec: "18K DPI SENSOR", price: "$189.99", icon: "bi-mouse3", code: "M01", detail: "Switches ópticos de respuesta inmediata montados sobre placa aislada. Latencia cero absoluta.", color: "text-cyan-400", borderColor: "border-cyan-400/40" },
                { id: 2, title: "TITAN RDX", spec: "12GB GDDR6", price: "$1.299", icon: "bi-gpu-card", code: "G12", detail: "Microprocesador tensorial masivo con soporte nativo para trazado de rayos y cálculo complejo.", color: "text-purple-400", borderColor: "border-purple-400/40" },
                { id: 3, title: "K-BOARD 75", spec: "MECHANICAL RGB", price: "$220.00", icon: "bi-keyboard", code: "K75", detail: "Plataforma compacta hot-swappable con switches lubricados de fábrica y keycaps PBT.", color: "text-emerald-400", borderColor: "border-emerald-400/40" }
            ];

            const productosPractica = [
                { id: 4, title: "DRILL 18V", spec: "POWER TORQUE", price: "$249.99", icon: "bi-nut", code: "T18", detail: "Motor industrial brushless de torque continuo, chasis de policarbonato reforzado anti-caídas.", color: "text-amber-500", borderColor: "border-amber-500/40" },
                { id: 5, title: "AMBI-LIGHT", spec: "SMART WIFI", price: "$169.99", icon: "bi-lightbulb", code: "L04", detail: "Lámpara domótica con matriz LED sintonizable y sincronización de audio de baja latencia.", color: "text-orange-400", borderColor: "border-orange-400/40" },
                { id: 6, title: "ROUTER CNC", spec: "MICRO MILLING", price: "$450.00", icon: "bi-cpu", code: "C09", detail: "Fresadora de precisión milimétrica guiada por controlador integrado de estado sólido.", color: "text-slate-900", borderColor: "border-slate-900/40" }
            ];

            return (
                <div class="w-full h-full flex flex-col relative bg-slate-950">
                    
                    {/* HEADER */}
                    <header class="h-16 w-full flex items-center justify-between px-4 bg-slate-950 border-b border-white/10 z-50">
                        <div class="flex items-center space-x-2">
                            <i class="bi bi-list text-xl text-white"></i>
                            <span class="text-sm font-bold tracking-tight font-space text-white">GONMO NAVE</span>
                        </div>
                        <i class="bi bi-search text-lg text-white opacity-80"></i>
                    </header>

                    {/* GRILLA INTERFAZ DUAL */}
                    <main class="flex-1 w-full flex relative overflow-hidden">
                        
                        {/* COLUMNA IZQUIERDA (ALPHA) */}
                        <div class="w-1/2 col-nave silicon-alpha px-2 py-4 border-r border-white/10">
                            <div class="mb-4 text-center border-b border-cyan-500/30 pb-2 sticky top-0 bg-[#060b19]/90 backdrop-blur-md z-20 rounded-b-lg">
                                <h2 class="text-[10px] font-black font-space tracking-widest text-cyan-400">// SILICIO ALPHA</h2>
                            </div>
                            <div class="space-y-4 pb-20">
                                {productosAlpha.map(p => (
                                    <div 
                                        key={p.id} 
                                        onClick={() => setSelectedProduct(p)}
                                        class="card-alpha-silicon rounded-2xl p-3 flex flex-col justify-between h-[210px] cursor-pointer transition-transform active:scale-95"
                                    >
                                        <div class="w-full h-24 rounded-xl flex flex-col items-center justify-center relative bg-slate-950/60 border border-cyan-500/20">
                                            <i class={`bi ${p.icon} text-3xl ${p.color}`}></i>
                                            <span class="absolute bottom-1 right-2 text-[8px] font-bold font-space text-cyan-500/30 tracking-widest">{p.code}</span>
                                        </div>
                                        <div class="mt-2">
                                            <h3 class="text-xs font-black tracking-tight text-white uppercase truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-cyan-400/80 tracking-wider uppercase mt-0.5">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2 pt-1 border-t border-white/5">
                                            <span class="text-xs font-black font-space text-white">{p.price}</span>
                                            <span class="w-6 h-6 rounded-full bg-cyan-400 text-slate-950 flex items-center justify-center text-[10px] shadow-lg"><i class="bi bi-eye-fill"></i></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* COLUMNA DERECHA (PRÁCTICA) */}
                        <div class="w-1/2 col-nave silicon-practica px-2 py-4">
                            <div class="mb-4 text-center border-b border-slate-950/20 pb-2 sticky top-0 bg-[#eab308]/90 backdrop-blur-md z-20 rounded-b-lg">
                                <h2 class="text-[10px] font-black font-space tracking-widest text-slate-950">// SILICIO PRÁCTICA</h2>
                            </div>
                            <div class="space-y-4 pb-20">
                                {productosPractica.map(p => (
                                    <div 
                                        key={p.id} 
                                        onClick={() => setSelectedProduct(p)}
                                        class="card-practica-silicon rounded-2xl p-3 flex flex-col justify-between h-[210px] cursor-pointer transition-transform active:scale-95"
                                    >
                                        <div class="w-full h-24 rounded-xl flex flex-col items-center justify-center relative bg-slate-100 border border-slate-950/10">
                                            <i class={`bi ${p.icon} text-3xl ${p.color}`}></i>
                                            <span class="absolute bottom-1 right-2 text-[8px] font-bold font-space text-slate-950/20 tracking-widest">{p.code}</span>
                                        </div>
                                        <div class="mt-2">
                                            <h3 class="text-xs font-black tracking-tight text-slate-950 uppercase truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-amber-800 tracking-wider uppercase mt-0.5">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2 pt-1 border-t border-slate-200">
                                            <span class="text-xs font-black font-space text-slate-950">{p.price}</span>
                                            <span class="w-6 h-6 rounded-full bg-slate-950 text-white flex items-center justify-center text-[10px] shadow-md"><i class="bi bi-eye-fill"></i></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* ASTRO-GONMO CENTER (CON LA CONDICION BASE64 INYECTADA) */}
                        <div class="astro-center pointer-events-none">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-sky-600 border-2 border-slate-950 shadow-2xl flex items-center justify-center pointer-events-auto cursor-pointer overflow-hidden">
                                <img 
                                    src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" 
                                    alt="Astro" 
                                    class="w-full h-full object-cover hidden"
                                    onError={(e) => e.target.classList.add('hidden')} 
                                />
                                <i class="bi bi-robot text-slate-950 text-base"></i>
                            </div>
                        </div>

                    </main>

                    {/* MODAL COMPLETAMENTE CENTRALIZADO Y OSCURO (COHERENCIA ALPHA) */}
                    {selectedProduct && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-950/85 backdrop-blur-lg">
                            {/* Tap de fondo para salir */}
                            <div class="absolute inset-0" onClick={() => setSelectedProduct(null)}></div>
                            
                            {/* Ventana de Impacto de Silicio Oscuro */}
                            <div class={`w-full max-w-[320px] bg-gradient-to-b from-[#0f172a] to-[#020617] rounded-3xl p-5 relative z-10 border-2 text-white shadow-[0_20px_50px_rgba(0,0,0,0.8)] animate-quantum-center ${selectedProduct.borderColor}`}>
                                
                                {/* Botón de Cierre */}
                                <button 
                                    onClick={() => setSelectedProduct(null)}
                                    class="absolute top-4 right-4 w-7 h-7 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xs text-white/70 active:scale-90"
                                >
                                    <i class="bi bi-x-lg"></i>
                                </button>

                                {/* Icono y Título */}
                                <div class="flex flex-col items-center text-center mt-2 mb-4">
                                    <div class="w-16 h-16 rounded-2xl bg-slate-950/80 border border-white/5 flex items-center justify-center text-3xl mb-3 shadow-inner">
                                        <i class={`bi ${selectedProduct.icon} ${selectedProduct.color}`}></i>
                                    </div>
                                    <span class="text-[9px] font-black font-space tracking-widest text-white/40 uppercase bg-white/5 px-2.5 py-0.5 rounded-full">
                                        MÓDULO // {selectedProduct.code}
                                    </span>
                                    <h2 class="text-lg font-black font-space tracking-tight mt-2 uppercase">{selectedProduct.title}</h2>
                                    <p class={`text-[10px] font-bold tracking-widest uppercase mt-0.5 ${selectedProduct.color}`}>
                                        {selectedProduct.spec}
                                    </p>
                                </div>

                                {/* Descripción de Alta Tecnología */}
                                <p class="text-xs text-slate-300 leading-relaxed text-center px-2 mb-5">
                                    {selectedProduct.detail}
                                </p>

                                {/* Contenedor de Precio y Compra */}
                                <div class="border-t border-white/10 pt-4 flex flex-col space-y-3">
                                    <div class="flex justify-between items-center px-1">
                                        <span class="text-[9px] font-bold font-space text-white/40 uppercase">VALOR ESTRUCTURA</span>
                                        <span class="text-xl font-black font-space text-white tracking-tight">{selectedProduct.price}</span>
                                    </div>
                                    <button class="w-full h-11 rounded-xl bg-cyan-400 text-slate-950 font-space font-black text-xs tracking-wider flex items-center justify-center space-x-2 shadow-[0_4px_12px_rgba(34,211,238,0.3)] active:scale-95 transition-transform">
                                        <i class="bi bi-lightning-charge-fill"></i>
                                        <span>INJECTAR EN NAVE</span>
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* BARRA INFERIOR */}
                    <nav class="h-16 w-full bg-slate-950 border-t border-white/10 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center text-cyan-400">
                            <i class="bi bi-grid-1x2-fill text-base"></i>
                            <span class="text-[8px] font-bold tracking-wider mt-0.5 font-space">NAVE</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="bi bi-person text-base"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="bi bi-bell text-base"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">AVISOS</span>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveSplit />);
    </script>
</body>
</html>
