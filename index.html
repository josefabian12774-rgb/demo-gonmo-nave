<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #02040a; }
        .col-nave { height: calc(100vh - 64px); overflow-y: auto; }
    </style>
</head>
<body>
    <div id="root" class="w-full h-full"></div>
    <script type="text/babel">
        function App() {
            return (
                <div className="w-full h-full flex flex-col text-white">
                    <header className="h-16 w-full flex items-center justify-between px-4 bg-slate-950 border-b border-white/10">
                        <div className="flex items-center space-x-3">
                            <i className="bi bi-list text-xl"></i>
                            <div className="flex items-center space-x-2">
                                <img src="./logo.JPG" alt="Logo" className="h-8 w-8 object-cover rounded-md border border-cyan-500/30" />
                                <span className="text-[10px] font-bold tracking-widest text-white/70 uppercase">GONMO<br/><span className="text-cyan-400">NAVE</span></span>
                            </div>
                        </div>
                        <i className="bi bi-search text-lg"></i>
                    </header>
                    <main className="flex-1 flex overflow-hidden">
                        <div className="w-1/2 col-nave bg-slate-900 border-r border-white/10">
                            <h2 className="text-center py-4 text-cyan-400 font-bold text-xs uppercase">// Silicio Alpha</h2>
                        </div>
                        <div className="w-1/2 col-nave bg-yellow-500">
                            <h2 className="text-center py-4 text-slate-900 font-bold text-xs uppercase">// Silicio Práctica</h2>
                        </div>
                    </main>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
