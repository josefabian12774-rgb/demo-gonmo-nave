<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — PREMIUM VISUAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;900&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        .col-nave { height: calc(100vh - 128px); overflow-y: scroll; overflow-x: hidden; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; padding-top: 24px; }
        .col-nave::-webkit-scrollbar { display: none; }
        .silicon-alpha { background-color: #060b19; background-image: linear-gradient(rgba(6, 182, 212, 0.05) 2px, transparent 2px), linear-gradient(90deg, rgba(6, 182, 212, 0.05) 2px, transparent 2px), radial-gradient(circle at 50% 50%, rgba(17, 28, 58, 0.6), #050914); background-size: 20px 20px, 20px 20px, 100% 100%; }
        .silicon-practica { background-color: #d9a406; background-image: linear-gradient(rgba(15, 23, 42, 0.04) 2px, transparent 2px), linear-gradient(90deg, rgba(15, 23, 42, 0.04) 2px, transparent 2px), radial-gradient(circle at 50% 50%, #f1c40f, #b78a02); background-size: 20px 20px, 20px 20px, 100% 100%; }
        .card-alpha-silicon { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); border: 2px solid rgba(6, 182, 212, 0.2); box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.05), 0 12px 24px rgba(0,0,0,0.4); }
        .card-practica-silicon { background: #ffffff; border: 2px solid #1e293b; box-shadow: 4px 4px 0px #1e293b, 0 8px 16px rgba(0,0,0,0.12); }
        .premium-modal-alpha { background: linear-gradient(180deg, #0b1329 0%, #030712 100%); border: 2px solid #22d3ee; box-shadow: 0 0 35px rgba(6, 182, 212, 0.4), inset 0 0 20px rgba(6, 182, 212, 0.15), 0 30px 60px rgba(0,0,0,0.85); }
        .premium-modal-practica { background: linear-gradient(180deg, #1c1917 0%, #0c0a09 100%); border: 2px solid #f59e0b; box-shadow: 0 0 35px rgba(245, 158, 11, 0.35), inset 0 0 20px rgba(245, 158, 11, 0.1), 0 30px 60px rgba(0,0,0,0.85); }
        .astro-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 115px; height: 150px; pointer-events: none; }
        .hologram-robot-box { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 14px rgba(6, 182, 212, 0.75)); }
        @keyframes proyectorPulse { 0%, 100% { transform: scale(1); opacity: 0.3; filter: blur(2px); } 50% { transform: scale(1.2); opacity: 0.6; filter: blur(1px); } }
        .hologram-glow { animation: proyectorPulse 2s ease-in-out infinite; }
        @keyframes pushUpQuantum { 0% { transform: scale(0.85) translateY(40px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .animate-quantum { animation: pushUpQuantum 0.22s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    </style>
</head>
<body class="antialiased select-none text-white bg-slate-950">
    <div id="root" class="w-full h-full"></div>
    <script type="text/babel">
        function GonmoNaveSplit() {
            const [selectedProduct, setSelectedProduct] = React.useState(null);
            const productosAlpha = [
                { id: 1, title: "NIGHTHAWK", spec: "18K DPI SENSOR", price: "$189.99", icon: "bi-mouse3", code: "M01", detail: "Switches ópticos de respuesta inmediata montados sobre placa aislada.", color: "text-cyan-400", side: "ALPHA" },
                { id: 2, title: "TITAN RDX", spec: "12GB GDDR6", price: "$1.299", icon: "bi-gpu-card", code: "G12", detail: "Microprocesador tensorial masivo.", color: "text-purple-400", side: "ALPHA" },
                { id: 3, title: "K-BOARD 75", spec: "MECHANICAL RGB", price: "$220.00", icon: "bi-keyboard", code: "K75", detail: "Plataforma compacta hot-swappable.", color: "text-emerald-400", side: "ALPHA" }
            ];
            const productosPractica = [
                { id: 4, title: "DRILL 18V", spec: "POWER TORQUE", price: "$249.99", icon: "bi-nut", code: "T18", detail: "Motor industrial brushless.", color: "text-slate-900", side: "PRACTICA" },
                { id: 5, title: "AMBI-LIGHT", spec: "SMART WIFI", price: "$169.99", icon: "bi-lightbulb", code: "L04", detail: "Lámpara domótica inteligente.", color: "text-slate-900", side: "PRACTICA" },
                { id: 6, title: "ROUTER CNC", spec: "MICRO MILLING", price: "$450.00", icon: "bi-cpu", code: "C09", detail: "Fresadora de precisión.", color: "text-slate-900", side: "PRACTICA" }
            ];

            return (
                <div className="w-full h-full flex flex-col relative bg-slate-950">
                    <header className="h-16 w-full flex items-center justify-between px-4 bg-slate-950/95 border-b border-white/10 z-50 backdrop-blur-md">
                        <div className="flex items-center space-x-3">
                            <i className="bi bi-list text-xl text-white"></i>
                            <div className="flex items-center space-x-2">
                                <img src="./logo.JPG" alt="Logo" className="h-8 w-8 object-cover rounded-md border border-cyan-500/30 shadow-[0_0_10px_rgba(6,182,212,0.5)]" />
                                <span className="text-sm font-bold tracking-tight font-space text-white uppercase leading-none">GONMO<br/><span className="text-[8px] text-cyan-400">NAVE</span></span>
                            </div>
                        </div>
                        <i className="bi bi-search text-lg text-white opacity-80"></i>
                    </header>
                    <main className="flex-1 w-full flex relative overflow-hidden">
                        <div className="w-1/2 col-nave silicon-alpha px-2 border-r border-white/10">
                            <div className="mb-4 text-center border-b border-cyan-500/30 pb-2 sticky top-0 bg-[#060b19]/90 backdrop-blur-md z-20"><h2 className="text-[10px] font-black font-space tracking-widest text-cyan-400 uppercase">// SILICIO ALPHA</h2></div>
                            {productosAlpha.map(p => (
                                <div key={p.id} onClick={() => setSelectedProduct(p)} className="card-alpha-silicon rounded-2xl p-3 flex flex-col justify-between h-[210px] cursor-pointer mb-4">
                                    <div className="w-full h-24 rounded-xl flex items-center justify-center bg-slate-950/60 border border-cyan-500/20"><i className={`bi ${p.icon} text-3xl ${p.color}`}></i></div>
                                    <h3 className="text-xs font-black text-white uppercase mt-2">{p.title}</h3>
                                    <div className="flex items-center justify-between mt-2 pt-1 border-t border-white/5"><span className="text-xs font-black font-space text-white">{p.price}</span><span className="w-6 h-6 rounded-full bg-cyan-400 text-slate-950 flex items-center justify-center text-[10px]"><i className="bi bi-eye-fill"></i></span></div>
                                </div>
                            ))}
                        </div>
                        <div className="w-1/2 col-nave silicon-practica px-2">
                            <div className="mb-4 text-center border-b border-slate-950/20 pb-2 sticky top-0 bg-[#d9a406]/90 backdrop-blur-md z-20"><h2 className="text-[10px] font-black font-space tracking-widest text-slate-950 uppercase">// SILICIO PRÁCTICA</h2></div>
                            {productosPractica.map(p => (
                                <div key={p.id} onClick={() => setSelectedProduct(p)} className="card-practica-silicon rounded-2xl p-3 flex flex-col justify-between h-[210px] cursor-pointer mb-4">
                                    <div className="w-full h-24 rounded-xl flex items-center justify-center bg-slate-100/90 border border-slate-950/15"><i className={`bi ${p.icon} text-3xl ${p.color}`}></i></div>
                                    <h3 className="text-xs font-black text-slate-900 uppercase mt-2">{p.title}</h3>
                                    <div className="flex items-center justify-between mt-2 pt-1 border-t border-slate-300"><span className="text-xs font-black font-space text-slate-900">{p.price}</span><span className="w-6 h-6 rounded-full bg-slate-950 text-white flex items-center justify-center text-[10px]"><i className="bi bi-eye-fill"></i></span></div>
                                </div>
                            ))}
                        </div>
                        <div className="astro-center"><div className="hologram-robot-box"><img src="./robot.gif" className="w-full h-full object-contain" alt="Astro"/></div><div className="w-14 h-1 bg-cyan-400/40 rounded-full mt-0.5 hologram-glow"></div></div>
                    </main>
                    {selectedProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-950/85 backdrop-blur-md" onClick={() => setSelectedProduct(null)}>
                            <div className={`w-full max-w-[315px] rounded-3xl p-5 relative animate-quantum ${selectedProduct.side === 'ALPHA' ? 'premium-modal-alpha' : 'premium-modal-practica'}`} onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedProduct(null)} className="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-slate-900 text-white border border-white/20 flex items-center justify-center text-sm z-50"><i className="bi bi-x-lg"></i></button>
                                <h2 className="text-xl font-black font-space text-center uppercase mb-4">{selectedProduct.title}</h2>
                                <button className="w-full h-11 rounded-xl bg-cyan-400 text-slate-950 font-black text-xs uppercase">INYECTAR EN NAVE</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveSplit />);
    </script>
</body>
</html>
