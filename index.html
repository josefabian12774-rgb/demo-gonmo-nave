        .silicon-practica {
            background-color: #eab308;

        .astro-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hologram-robot-box {
            width: 110px;
            height: 140px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.8));
            animation: levitate 3s ease-in-out infinite;
        }

        @keyframes levitate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }

        /* ANIMACIÓN QUANTUM PARA EL MODAL */
        @keyframes pushUpQuantum {
