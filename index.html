<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — DIVISION VERTICAL V2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Space+Grotesk:wght@700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b132b;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }

        /* Contenedores fijos para forzar el 50/50 vertical en mobile */
        .col-nave {
            height: calc(100vh - 128px); /* Descuenta header y footer fijos */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Ocultar barra de scroll para estética premium */
        .col-nave::-webkit-scrollbar {
            display: none;
        }

        /* Ajuste fino de imágenes reales */
        .img-premium {
            max-height: 75px;
            object-fit: contain;
            filter: drop-shadow(0px 8px 12px rgba(0,0,0,0.3));
        }

        /* Astro-Gonmo flotando en el eje central exacto */
        .astro-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
        }
    </style>
</head>
<body class="antialiased select-none text-white">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        function GonmoNaveSplit() {
            const productosAlpha = [
                { id: 1, title: "NIGHTHAWK", spec: "18K DPI", price: "$189.99", img: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?auto=format&fit=crop&w=200&q=80", code: "M01" },
                { id: 2, title: "TITAN RDX", spec: "12GB VRAM", price: "$1,299", img: "https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=200&q=80", code: "G12" }
            ];

            const productosPractica = [
                { id: 3, title: "DRILL 18V", spec: "INDUSTRIAL", price: "$249.99", img: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&w=200&q=80", code: "T18" },
                { id: 4, title: "AMBI-LIGHT", spec: "SMART WIFI", price: "$169.99", img: "https://images.unsplash.com/photo-1565814636199-ae8133055c1c?auto=format&fit=crop&w=200&q=80", code: "L04" }
            ];

            return (
                <div class="w-full h-full flex flex-col relative bg-slate-950">
                    
                    {/* HEADER FIJO */}
                    <header class="h-16 w-full flex items-center justify-between px-4 bg-slate-950 border-b border-white/10 z-50">
                        <div class="flex items-center space-x-2">
                            <i class="bi bi-list text-xl"></i>
                            <span class="text-sm font-bold tracking-tight font-space text-white">GONMO NAVE</span>
                        </div>
                        <i class="bi bi-search text-lg text-white opacity-80"></i>
                    </header>

                    {/* ESTRUCTURA DUAL VERTICAL (IZQUIERDA Y DERECHA COEXISTENTES) */}
                    <main class="flex-1 w-full flex relative">
                        
                        {/* COLUMNA IZQUIERDA: ZONA ALPHA */}
                        <div class="w-1/2 col-nave bg-[#0b132b] px-2 py-4 border-r border-white/5">
                            <div class="mb-4 text-center border-b border-cyan-500/20 pb-1">
                                <h2 class="text-xs font-black font-space tracking-wider text-cyan-400">// ZONA ALPHA</h2>
                            </div>
                            <div class="space-y-3">
                                {productosAlpha.map(p => (
                                    <div key={p.id} class="bg-[#111c3a] border border-white/5 rounded-xl p-3 flex flex-col justify-between min-h-[175px] shadow-md">
                                        <div class="text-center bg-slate-950/20 rounded-lg py-2 flex items-center justify-center min-h-[85px]">
                                            <img src={p.img} alt={p.title} class="img-premium" />
                                        </div>
                                        <div>
                                            <h3 class="text-xs font-black tracking-tight leading-none text-white truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-cyan-400 tracking-wide mt-0.5">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2">
                                            <span class="text-xs font-black font-space text-white">{p.price}</span>
                                            <button class="w-6 h-6 rounded-full bg-white text-slate-950 flex items-center justify-center text-[10px]">
                                                <i class="bi bi-lightning-charge-fill"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* COLUMNA DERECHA: ZONA PRÁCTICA */}
                        <div class="w-1/2 col-nave bg-[#F4D03F] px-2 py-4">
                            <div class="mb-4 text-center border-b border-slate-950/10 pb-1">
                                <h2 class="text-xs font-black font-space tracking-wider text-slate-950">// ZONA PRÁCTICA</h2>
                            </div>
                            <div class="space-y-3">
                                {productosPractica.map(p => (
                                    <div key={p.id} class="bg-white border border-slate-200 rounded-xl p-3 flex flex-col justify-between min-h-[175px] shadow-md">
                                        <div class="text-center bg-slate-100 rounded-lg py-2 flex items-center justify-center min-h-[85px]">
                                            <img src={p.img} alt={p.title} class="img-premium" />
                                        </div>
                                        <div>
                                            <h3 class="text-xs font-black tracking-tight leading-none text-slate-950 truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-amber-600 tracking-wide mt-0.5">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2">
                                            <span class="text-xs font-black font-space text-slate-950">{p.price}</span>
                                            <button class="w-6 h-6 rounded-full bg-slate-950 text-white flex items-center justify-center text-[10px]">
                                                <i class="bi bi-lightning-charge-fill"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* ASTRO-GONMO FLOTANDO FIJO EN EL CENTRO EXACTO */}
                        <div class="astro-center pointer-events-none flex flex-col items-center">
                            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-600 via-sky-400 to-white border-2 border-slate-950 shadow-2xl flex items-center justify-center pointer-events-auto cursor-pointer">
                                <i class="bi bi-robot text-slate-950 text-sm"></i>
                            </div>
                        </div>

                    </main>

                    {/* BARRA COMERCIAL INFERIOR FIJA */}
                    <nav class="h-16 w-full bg-slate-950 border-t border-white/10 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center text-cyan-400">
                            <i class="bi bi-grid-1x2-fill text-base"></i>
                            <span class="text-[8px] font-bold tracking-wider mt-0.5 font-space">NAVE</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="bi bi-person text-base"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center relative">
                            <i class="bi bi-bell text-base"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">AVISOS</span>
                            <span class="absolute top-0 right-3 bg-red-500 w-1.5 h-1.5 rounded-full"></span>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveSplit />);
    </script>
</body>
</html>
