<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — PREMIUM VISUAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;900&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        .col-nave { height: calc(100vh - 128px); overflow-y: auto; scroll-behavior: smooth; padding-top: 24px; }
        .col-nave::-webkit-scrollbar { display: none; }
        .silicon-alpha { background-color: #060b19; }
        .silicon-practica { background-color: #d9a406; }
        .card-alpha-silicon { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); border: 2px solid rgba(6, 182, 212, 0.2); }
        .card-practica-silicon { background: #ffffff; border: 2px solid #1e293b; }
        
        @keyframes pushUpQuantum {
            0 { transform: scale(0.85) translateY(40px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-quantum { animation: pushUpQuantum 0.4s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    </style>
</head>
<body class="antialiased select-none text-white bg-slate-950">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        function GonmoNaveSplit() {
            const productosAlpha = [
                { id: 1, title: "NIGHTHAWK", icon: "bi-mouse3", color: "text-cyan-400" },
                { id: 2, title: "TITAN RDX", icon: "bi-gpu-card", color: "text-purple-400" },
                { id: 3, title: "K-BOARD 75", icon: "bi-keyboard", color: "text-emerald-400" }
            ];

            const productosPractica = [
                { id: 4, title: "DRILL 18V", icon: "bi-nut", color: "text-slate-900" },
                { id: 5, title: "AMBI-LIGHT", icon: "bi-lightbulb", color: "text-slate-900" },
                { id: 6, title: "ROUTER CNC", icon: "bi-cpu", color: "text-slate-900" }
            ];

            return (
                <div className="w-full h-full flex flex-col bg-slate-950">
                    {/* Header corregido: el logo es parte del flujo, eliminando el vacío y el choque absoluto */}
                    <header className="h-20 w-full flex items-center justify-between px-4 bg-slate-950 border-b border-white/10 z-50">
                        <i className="bi bi-list text-xl text-white"></i>
                        <img src="./logo.JPG" alt="Logo" className="h-16 w-16 object-contain" />
                        <i className="bi bi-search text-lg text-white"></i>
                    </header>

                    <main className="flex-1 w-full flex overflow-hidden">
                        <div className="w-1/2 col-nave silicon-alpha px-2">
                            {productosAlpha.map(p => (
                                <div key={p.id} className="card-alpha-silicon rounded-2xl p-4 mb-4 animate-quantum">
                                    <i className={`bi ${p.icon} text-3xl ${p.color}`}></i>
                                    <h3 className="text-xs font-black text-white mt-2">{p.title}</h3>
                                </div>
                            ))}
                        </div>
                        <div className="w-1/2 col-nave silicon-practica px-2">
                            {productosPractica.map(p => (
                                <div key={p.id} className="card-practica-silicon rounded-2xl p-4 mb-4 animate-quantum">
                                    <i className={`bi ${p.icon} text-3xl ${p.color}`}></i>
                                    <h3 className="text-xs font-black text-slate-900 mt-2">{p.title}</h3>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveSplit />);
    </script>
</body>
</html>
