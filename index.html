<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — PREMIUM VISUAL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;900&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; }
        .col-nave { height: calc(100vh - 128px); overflow-y: auto; scroll-behavior: smooth; padding-top: 10px; }
        .col-nave::-webkit-scrollbar { display: none; }
        
        @keyframes pushUpQuantum {
            0 { transform: scale(0.95) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-quantum { animation: pushUpQuantum 0.4s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    </style>
</head>
<body class="antialiased select-none text-white bg-slate-950">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        function GonmoNave() {
            return (
                <div className="w-full h-full flex flex-col bg-slate-950">
                    {/* Header corregido: logo integrado para eliminar el espacio vacío */}
                    <header className="h-20 w-full flex items-center justify-between px-4 border-b border-white/10 shrink-0">
                        <i className="bi bi-list text-xl"></i>
                        <img src="./logo.JPG" alt="Logo" className="h-16 w-16 object-contain" />
                        <i className="bi bi-search text-xl"></i>
                    </header>

                    <main className="flex-1 w-full flex overflow-hidden">
                        <div className="w-1/2 col-nave bg-slate-900 border-r border-white/10 px-2 animate-quantum">
                            <div className="text-center py-2 text-[10px] text-cyan-400 font-black tracking-widest">// SILICIO ALPHA</div>
                            {/* Contenido aquí */}
                        </div>
                        <div className="w-1/2 col-nave bg-yellow-500 px-2 animate-quantum">
                            <div className="text-center py-2 text-[10px] text-slate-950 font-black tracking-widest">// SILICIO PRÁCTICA</div>
                            {/* Contenido aquí */}
                        </div>
                    </main>

                    <nav className="h-16 w-full border-t border-white/10 flex items-center justify-around text-slate-400">
                        <i className="bi bi-cart3 text-xl"></i>
                        <i className="bi bi-person text-xl"></i>
                        <i className="bi bi-bell text-xl"></i>
                    </nav>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNave />);
    </script>
</body>
</html>
