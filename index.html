<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — FORCE VIDEO V3.3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=700;800&family=Space+Grotesk:wght=700;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }

        /* SCROLL INDEPENDIENTE AISLADO */
        .col-nave {
            height: calc(100vh - 128px);
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .col-nave::-webkit-scrollbar { display: none; }

        /* Estilos de fondo de los sectores */
        .silicon-alpha {
            background-color: #060b19;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.07) 2px, transparent 2px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.07) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, rgba(17, 28, 58, 0.8), #050914);
            background-size: 20px 20px, 20px 20px, 100% 100%;
        }
        .silicon-practica {
            background-color: #eab308;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 2px, transparent 2px),
                radial-gradient(circle at 50% 50%, #f4d03f, #ca8a04);
            background-size: 25px 25px, 25px 25px, 100% 100%;
        }

        .card-alpha-silicon {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            border: 2px solid rgba(6, 182, 212, 0.2);
            box-shadow: inset 0 0 15px rgba(6, 182, 212, 0.1), 0 12px 24px rgba(0,0,0,0.5);
        }
        .card-practica-silicon {
            background: #ffffff;
            border: 2px solid #0f172a;
            box-shadow: 4px 4px 0px #0f172a, 0 8px 16px rgba(0,0,0,0.15);
        }

        /* CONTENEDOR CENTRAL DEL VIDEO HOLOGRAMA */
        .astro-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hologram-video-box {
            width: 140px;
            height: 175px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.7));
        }

        /* ANIMACIÓN QUANTUM PARA EL MODAL */
        @keyframes pushUpQuantum {
            0% { transform: scale(0.6) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-quantum {
            animation: pushUpQuantum 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards;
        }
    </style>
</head>
<body class="antialiased select-none text-white">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        function GonmoNaveSplit() {
            const [selectedProduct, setSelectedProduct] = React.useState(null);
            const videoRef = React.useRef(null);

            // Fuerza la reproducción en celulares saltándose el bloqueo de energía
            React.useEffect(() => {
                if (videoRef.current) {
                    videoRef.current.muted = true;
                    videoRef.current.defaultMuted = true;
                    const playPromise = videoRef.current.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.log("Auto-play prevenido, reintentando...", error);
                        });
                    }
                }
            }, []);

            const productosAlpha = [
                { id: 1, title: "NIGHTHAWK", spec: "18K DPI SENSOR", price: "$189.99", icon: "bi-mouse3", code: "M01", detail: "Switches ópticos de respuesta inmediata montados sobre placa aislada. Latencia cero absoluta.", color: "text-cyan-400", side: "ALPHA" },
                { id: 2, title: "TITAN RDX", spec: "12GB GDDR6", price: "$1.299", icon: "bi-gpu-card", code: "G12", detail: "Microprocesador tensorial masivo con soporte nativo para trazado de rayos y cálculo complejo.", color: "text-purple-400", side: "ALPHA" },
                { id: 3, title: "K-BOARD 75", spec: "MECHANICAL RGB", price: "$220.00", icon: "bi-keyboard", code: "K75", detail: "Plataforma compacta hot-swappable con switches lubricados de fábrica y keycaps PBT.", color: "text-emerald-400", side: "ALPHA" }
            ];

            const productosPractica = [
                { id: 4, title: "DRILL 18V", spec: "POWER TORQUE", price: "$249.99", icon: "bi-nut", code: "T18", detail: "Motor industrial brushless de torque continuo, chasis de policarbonato reforzado anti-caídas.", color: "text-amber-500", side: "PRACTICA" },
                { id: 5, title: "AMBI-LIGHT", spec: "SMART WIFI", price: "$169.99", icon: "bi-lightbulb", code: "L04", detail: "Lámpara domótica con matriz LED sintonizable y sincronización de audio de baja latencia.", color: "text-orange-400", side: "PRACTICA" },
                { id: 6, title: "ROUTER CNC", spec: "MICRO MILLING", price: "$450.00", icon: "bi-cpu", code: "C09", detail: "Fresadora de precisión milimétrica guiada por controlador integrado de estado sólido.", color: "text-amber-600", side: "PRACTICA" }
            ];

            return (
                <div class="w-full h-full flex flex-col relative bg-slate-950">
                    
                    {/* HEADER */}
                    <header class="h-16 w-full flex items-center justify-between px-4 bg-slate-950 border-b border-white/10 z-50">
                        <div class="flex items-center space-x-2">
                            <i class="bi bi-list text-xl text-white"></i>
                            <span class="text-sm font-bold tracking-tight font-space text-white uppercase">GONMO NAVE</span>
                        </div>
                        <i class="bi bi-search text-lg text-white opacity-80"></i>
                    </header>

                    {/* INTERFAZ DUAL COEXISTENTE */}
                    <main class="flex-1 w-full flex relative overflow-hidden">
                        
                        {/* ZONA ALPHA */}
                        <div class="w-1/2 col-nave silicon-alpha px-2 py-4 border-r border-white/10">
                            <div class="mb-4 text-center border-b border-cyan-500/30 pb-2 sticky top-0 bg-[#060b19]/90 backdrop-blur-md z-20 rounded-b-lg">
                                <h2 class="text-[10px] font-black font-space tracking-widest text-cyan-400 leading-none uppercase">// SILICIO ALPHA</h2>
                            </div>
                            <div class="space-y-4 pb-24">
                                {productosAlpha.map(p => (
                                    <div 
                                        key={p.id} 
                                        onClick={() => setSelectedProduct(p)}
                                        class="card-alpha-silicon rounded-2xl p-3 flex flex-col justify-between h-[210px] cursor-pointer transition-transform active:scale-95"
                                    >
                                        <div class="w-full h-24 rounded-xl flex flex-col items-center justify-center relative bg-slate-950/60 border border-cyan-500/20">
                                            <i class={`bi ${p.icon} text-3xl ${p.color}`}></i>
                                            <span class="absolute bottom-1 right-2 text-[8px] font-bold font-space text-cyan-500/30 tracking-widest">{p.code}</span>
                                        </div>
                                        <div class="mt-2">
                                            <h3 class="text-xs font-black tracking-tight text-white uppercase truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-cyan-400/80 tracking-wider uppercase mt-0.5">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2 pt-1 border-t border-white/5">
                                            <span class="text-xs font-black font-space text-white">{p.price}</span>
                                            <span class="w-6 h-6 rounded-full bg-cyan-400 text-slate-950 flex items-center justify-center text-[10px] shadow-lg"><i class="bi bi-eye-fill"></i></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* ZONA PRÁCTICA */}
                        <div class="w-1/2 col-nave silicon-practica px-2 py-4">
                            <div class="mb-4 text-center border-b border-slate-950/20 pb-2 sticky top-0 bg-[#eab308]/90 backdrop-blur-md z-20 rounded-b-lg">
                                <h2 class="text-[10px] font-black font-space tracking-widest text-slate-950 leading-none uppercase">// SILICIO PRÁCTICA</h2>
                            </div>
                            <div class="space-y-4 pb-24">
                                {productosPractica.map(p => (
                                    <div 
                                        key={p.id} 
                                        onClick={() => setSelectedProduct(p)}
                                        class="card-practica-silicon rounded-2xl p-3 flex flex-col justify-between h-[210px] cursor-pointer transition-transform active:scale-95"
                                    >
                                        <div class="w-full h-24 rounded-xl flex flex-col items-center justify-center relative bg-slate-100 border border-slate-950/10">
                                            <i class={`bi ${p.icon} text-3xl ${p.color}`}></i>
                                            <span class="absolute bottom-1 right-2 text-[8px] font-bold font-space text-slate-950/20 tracking-widest">{p.code}</span>
                                        </div>
                                        <div class="mt-2">
                                            <h3 class="text-xs font-black tracking-tight text-slate-950 uppercase truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-amber-800 tracking-wider uppercase mt-0.5">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2 pt-1 border-t border-slate-200">
                                            <span class="text-xs font-black font-space text-slate-950">{p.price}</span>
                                            <span class="w-6 h-6 rounded-full bg-slate-950 text-white flex items-center justify-center text-[10px] shadow-md"><i class="bi bi-eye-fill"></i></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* REPRODUCTOR MEJORADO CON REFERENCIA ACTIVA */}
                        <div class="astro-center pointer-events-none">
                            <div class="hologram-video-box">
                                <video 
                                    ref={videoRef}
                                    src="https://cdn.jsdelivr.net/gh/n12774-rgb/n12774-rgb.github.io/robot.mp4" 
                                    preload="auto"
                                    loop 
                                    muted 
                                    playsinline
                                    webkit-playsinline="true"
                                    class="w-full h-full object-contain block"
                                >
                                    Tu navegador no soporta video.
                                </video>
                            </div>
                            <div class="w-16 h-1 bg-cyan-400/30 blur-[2px] rounded-full mt-1.5 shadow-[0_0_10px_#22d3ee]"></div>
                        </div>

                    </main>

                    {/* MODAL PUSH-UP QUANTUM */}
                    {selectedProduct && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-slate-950/90 backdrop-blur-md">
                            <div class="absolute inset-0" onClick={() => setSelectedProduct(null)}></div>
                            
                            <div class={`w-full max-w-[310px] bg-gradient-to-b from-[#0b0f19] to-[#03050a] rounded-3xl p-5 relative z-10 border-2 text-white shadow-[0_25px_60px_rgba(0,0,0,0.9)] animate-quantum ${
                                selectedProduct.side === 'ALPHA' ? 'border-cyan-500/50' : 'border-amber-500/60'
                            }`}>
                                
                                <button 
                                    onClick={() => setSelectedProduct(null)}
                                    class="absolute top-4 right-4 w-7 h-7 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xs text-white/60 active:scale-90"
                                >
                                    <i class="bi bi-x-lg"></i>
                                </button>

                                <div class={`w-full h-28 rounded-2xl flex items-center justify-center border mb-4 relative overflow-hidden bg-slate-950/60 ${
                                    selectedProduct.side === 'ALPHA' ? 'border-cyan-500/20 shadow-[inset_0_0_15px_rgba(6,182,212,0.1)]' : 'border-amber-500/20 shadow-[inset_0_0_15px_rgba(234,179,8,0.1)]'
                                }`}>
                                    <i class={`bi ${selectedProduct.icon} text-4xl ${selectedProduct.color} drop-shadow-[0_0_10px_currentColor]`}></i>
                                    <span class="absolute bottom-2 right-3 text-[9px] font-bold font-space opacity-30 tracking-widest">{selectedProduct.code}</span>
                                </div>

                                <div class="text-center mb-4">
                                    <h2 class="text-lg font-black font-space tracking-tight uppercase leading-none">{selectedProduct.title}</h2>
                                    <p class={`text-[9px] font-bold tracking-widest uppercase mt-1 ${
                                        selectedProduct.side === 'ALPHA' ? 'text-cyan-400' : 'text-amber-500'
                                    }`}>
                                        {selectedProduct.spec}
                                    </p>
                                </div>

                                <p class="text-[11px] text-slate-400 leading-relaxed text-center px-1 mb-4">
                                    {selectedProduct.detail}
                                </p>

                                <div class="border-t border-white/10 pt-3 flex flex-col space-y-2">
                                    <div class="flex justify-between items-center px-1">
                                        <span class="text-[8px] font-bold font-space text-white/30 uppercase">VALOR NAVE</span>
                                        <span class="text-xl font-black font-space text-white tracking-tight">{selectedProduct.price}</span>
                                    </div>
                                    
                                    <button class={`w-full h-11 rounded-xl font-space font-black text-xs tracking-wider flex items-center justify-center space-x-2 transition-transform active:scale-95 ${
                                        selectedProduct.side === 'ALPHA'
                                            ? 'bg-cyan-400 text-slate-950 shadow-[0_4px_15px_rgba(34,211,238,0.3)]'
                                            : 'bg-amber-500 text-slate-950 shadow-[0_4px_15px_rgba(234,179,8,0.3)]'
                                    }`}>
                                        <i class="bi bi-lightning-charge-fill"></i>
                                        <span>INYECTAR EN NAVE</span>
                                    </button>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* BARRA INFERIOR COMERCIAL */}
                    <nav class="h-16 w-full bg-slate-950 border-t border-white/10 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center text-cyan-400 relative cursor-pointer">
                            <i class="bi bi-cart3 text-lg"></i>
                            <span class="text-[8px] font-bold tracking-wider mt-0.5 font-space">CARRITO</span>
                            <span class="absolute top-0 right-3 bg-red-500 text-white font-bold text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-space">3</span>
                        </div>
                        <div class="flex flex-col items-center hover:text-white transition-colors cursor-pointer">
                            <i class="bi bi-person text-lg"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5 uppercase">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center hover:text-white transition-colors relative cursor-pointer">
                            <i class="bi bi-bell text-lg"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5 uppercase">NOTIFICACIONES</span>
                            <span class="absolute top-1 right-5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveSplit />);
    </script>
</body>
</html>
