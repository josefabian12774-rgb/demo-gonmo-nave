<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GONMO NAVE — NEXO ARQUETIPO V1.3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.25s ease;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        
        /* Asistente Esférico Premium Rediseñado y Acotado */
        .assistant-sphere {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f0f9ff, #38bdf8 45%, #0284c7 75%, #0369a1 100%);
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.6), 0 8px 20px rgba(14, 165, 233, 0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .assistant-core {
            position: absolute;
            top: 28%;
            left: 28%;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #ffffff, #22d3ee 60%, #0891b2 100%);
            box-shadow: 0 0 10px #22d3ee;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-cyan-500 selection:text-slate-950">
    <div id="root" class="w-full flex-1 flex flex-col"></div>

    <script type="text/babel">
        function GonmoNaveApp() {
            // Estado para alternar dinámicamente entre las dos zonas psicológicas
            const [tabActiva, setTabActiva] = React.useState("ALPHA"); 

            const productos = {
                ALPHA: [
                    { id: 1, title: "NIGHTHAWK 18K", spec: "PRD-OPTIC SENSOR", detail: "Resolución de 18K DPI nativos de respuesta inmediata.", price: "$189.99", icon: "bi-mouse3-fill", code: "M01" },
                    { id: 2, title: "ASUS ROG TITAN", spec: "12GB GDDR6 VRAM", detail: "Arquitectura de última generación con soporte Ray Tracing activo.", price: "$1,299.99", icon: "bi-gpu-card", code: "G12" }
                ],
                PRACTICA: [
                    { id: 3, title: "POWER-DRILL 18V", spec: "TEOMKL 33SO H3", detail: "Motor industrial de torque masivo para entornos demandantes.", price: "$249.99", icon: "bi-nut-fill", code: "T18", tag: "PRO" },
                    { id: 4, title: "PHILIPS AMBI-LIGHT", spec: "🌐 SMART WIFI CONTROL", detail: "Iluminación ambiental de alta fidelidad con presets automatizados.", price: "$169.99", icon: "bi-lightbulb-fill", code: "L04", tag: "WIFI" }
                ]
            };

            // Estilos dinámicos del contenedor principal según la directiva de fondo violento
            const bgClase = tabActiva === "ALPHA" ? "bg-[#0b132b] text-white" : "bg-[#F4D03F] text-slate-950";

            return (
                <div class={`flex-1 flex flex-col w-screen min-h-screen pb-24 transition-colors duration-300 ${bgClase}`}>
                    
                    {/* HEADER PREMIUM CON DESENFOQUE DE CRISTAL */}
                    <header class="fixed top-0 inset-x-0 h-16 flex items-center justify-between px-6 bg-slate-950/20 backdrop-blur-md border-b border-white/10 z-50">
                        <div class="flex items-center space-x-3">
                            <i class="bi bi-list text-xl opacity-80 cursor-pointer hover:opacity-100"></i>
                            <span class="text-lg font-bold tracking-tight font-space uppercase">GONMO NAVE</span>
                        </div>
                        <div class="flex items-center space-x-6 text-lg opacity-90">
                            <i class="bi bi-person cursor-pointer hover:opacity-100 transition-opacity"></i>
                            <i class="bi bi-search cursor-pointer hover:opacity-100 transition-opacity"></i>
                        </div>
                    </header>

                    {/* SELECTOR MÓVIL DE PESTAÑAS (SISTEMA DUAL FIX) */}
                    <div class="mt-16 w-full flex border-b border-white/10 sticky top-16 z-40 bg-slate-950/10 backdrop-blur-sm">
                        <button 
                            onClick={() => setTabActiva("ALPHA")}
                            class={`flex-1 py-3.5 text-center font-space text-xs font-bold tracking-[0.2em] uppercase transition-all ${tabActiva === "ALPHA" ? "bg-[#111c3a] text-cyan-400 border-b-2 border-cyan-400 font-extrabold" : "bg-slate-950/20 opacity-50 text-current"}`}
                        >
                            // ZONA ALPHA
                        </button>
                        <button 
                            onClick={() => setTabActiva("PRACTICA")}
                            class={`flex-1 py-3.5 text-center font-space text-xs font-bold tracking-[0.2em] uppercase transition-all ${tabActiva === "PRACTICA" ? "bg-white text-slate-950 border-b-2 border-slate-950 font-extrabold" : "bg-slate-950/20 opacity-50 text-current"}`}
                        >
                            // ZONA PRÁCTICA
                        </button>
                    </div>

                    {/* CONTENIDO DE PRODUCTOS EN ALTA FIDELIDAD */}
                    <main class="flex-1 p-5 max-w-md mx-auto w-full mt-4">
                        <div class="space-y-5">
                            {productos[tabActiva].map(item => (
                                <div 
                                    key={item.id} 
                                    class={`relative rounded-2xl p-5 flex items-center justify-between shadow-xl transition-all border ${
                                        tabActiva === "ALPHA" 
                                            ? "bg-[#111c3a] border-white/5 text-white" 
                                            : "bg-white border-slate-200 text-slate-950"
                                    }`}
                                >
                                    {/* DETALLES COMERCIALES (EL PRODUCTO ES EL REY) */}
                                    <div class="w-[62%] flex flex-col justify-between pr-2">
                                        <div>
                                            <div class="flex items-center space-x-2 mb-1">
                                                <h3 class="text-lg font-bold tracking-tight leading-tight">{item.title}</h3>
                                                {item.tag && (
                                                    <span class="bg-amber-500/10 text-amber-800 text-[9px] font-bold px-1.5 py-0.5 rounded border border-amber-500/20 font-space uppercase">
                                                        {item.tag}
                                                    </span>
                                                )}
                                            </div>
                                            <p class={`text-[10px] font-bold tracking-wider uppercase ${tabActiva === "ALPHA" ? "text-cyan-400" : "text-amber-600"}`}>
                                                {item.spec}
                                            </p>
                                            <p class={`text-xs mt-2 leading-relaxed ${tabActiva === "ALPHA" ? "text-slate-300" : "text-slate-600"}`}>
                                                {item.detail}
                                            </p>
                                        </div>
                                        
                                        <div class="mt-4 flex items-center justify-between">
                                            <span class="text-base font-extrabold font-space tracking-tight">
                                                {item.price}
                                            </span>
                                            <button class={`w-9 h-9 rounded-full flex items-center justify-center shadow-md transition-transform active:scale-95 ${
                                                tabActiva === "ALPHA" 
                                                    ? "bg-white text-slate-950 hover:bg-cyan-400" 
                                                    : "bg-slate-950 text-white hover:bg-amber-500 hover:text-slate-950"
                                            }`}>
                                                <i class="bi bi-lightning-charge-fill text-xs"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* PLACEHOLDER VECTORIAL DE ALTA FIDELIDAD (MUESTRA EL CÓDIGO Y DISEÑO LIMPIO) */}
                                    <div class={`w-[35%] h-32 rounded-xl flex flex-col items-center justify-center relative ${
                                        tabActiva === "ALPHA" ? "bg-[#1a264e]" : "bg-slate-50"
                                    }`}>
                                        <i class={`bi ${item.icon} text-3xl mb-1 opacity-70`}></i>
                                        <span class="text-[10px] font-bold font-space tracking-widest opacity-40 select-none">
                                            {item.code}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    {/* ASISTENTE VIRTUAL OMNIPRESENTE ACOTADO (ESQUINA INFERIOR DERECHA) */}
                    <div class="fixed bottom-20 right-4 flex items-center space-x-3 pointer-events-none z-40">
                        {/* Diálogo emergente integrado con el espacio correcto */}
                        <div class="bg-slate-950/90 backdrop-blur-md border border-white/10 text-white rounded-xl px-3 py-2 text-[11px] max-w-[200px] shadow-2xl pointer-events-auto">
                            <p class="font-bold text-cyan-400 text-[8px] font-space tracking-widest uppercase mb-0.5">CORE // ACTIVE</p>
                            <p class="text-slate-300 leading-tight">¿Qué módulo desplegamos hoy, Fabián?</p>
                        </div>
                        
                        {/* Esfera fijos de 55px */}
                        <div class="assistant-sphere relative pointer-events-auto cursor-pointer shadow-lg hover:scale-105 transition-transform">
                            <div class="assistant-core"></div>
                        </div>
                    </div>

                    {/* BARRA DE NAVEGACIÓN INFERIOR COMERCIAL MINIMALISTA */}
                    <nav class="fixed bottom-0 inset-x-0 h-16 bg-slate-950/80 backdrop-blur-md border-t border-white/10 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center cursor-pointer text-cyan-400 relative">
                            <i class="bi bi-cart3 text-lg"></i>
                            <span class="text-[9px] font-bold tracking-wider mt-0.5 font-space">CARRITO</span>
                            <span class="absolute top-0 right-2 bg-cyan-500 text-slate-950 font-bold text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-space">3</span>
                        </div>
                        <div class="flex flex-col items-center cursor-pointer hover:text-white transition-colors">
                            <i class="bi bi-person text-lg"></i>
                            <span class="text-[9px] font-medium tracking-wider mt-0.5">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center cursor-pointer hover:text-white transition-colors relative">
                            <i class="bi bi-bell text-lg"></i>
                            <span class="text-[9px] font-medium tracking-wider mt-0.5">NOTIFICACIONES</span>
                            <span class="absolute top-1 right-5 bg-red-500 w-1.5 h-1.5 rounded-full"></span>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveApp />);
    </script>
</body>
</html>
