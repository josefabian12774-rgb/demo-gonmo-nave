<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE — SILICIO & SCROLL V2.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050b14;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }

        /* Contenedores con SCROLL INDEPENDIENTE estricto por lado */
        .col-nave {
            height: calc(100vh - 128px);
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        /* Ocultar barras de scroll visuales pero mantener la funcionalidad nativa */
        .col-nave::-webkit-scrollbar { display: none; }

        /* Textura de Silicio Cyberpunk (Zona Alpha) */
        .silicon-bg {
            background-color: #0b132b;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 15px 15px;
        }

        /* Textura Técnica de Ingeniería (Zona Práctica) */
        .blueprint-bg {
            background-color: #F4D03F;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Acabados de Placas de Silicio en Tarjetas Tech */
        .silicon-card {
            background: linear-gradient(145deg, #111c3a, #080f21);
            border: 1px solid rgba(0, 242, 254, 0.15);
            box-shadow: inset 0 0 12px rgba(0, 242, 254, 0.05), 0 10px 20px rgba(0,0,0,0.4);
        }

        /* Astro-Gonmo flotando exactamente sobre la grieta central */
        .astro-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
        }
        .glow-avatar {
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.7), inset 0 0 10px rgba(255,255,255,0.6);
        }
    </style>
</head>
<body class="antialiased select-none text-white">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        function GonmoNaveSplit() {
            // Módulos duplicados para forzar la prueba de scroll independiente por columna
            const productosAlpha = [
                { id: 1, title: "NIGHTHAWK", spec: "18K DPI SENSOR", price: "$189.99", icon: "bi-mouse3", code: "M01" },
                { id: 2, title: "TITAN RDX", spec: "12GB GDDR6", price: "$1.299", icon: "bi-gpu-card", code: "G12" },
                { id: 3, title: "K-BOARD PRO", spec: "MECHANICAL RGB", price: "$210.00", icon: "bi-keyboard", code: "K99" },
                { id: 4, title: "CORE AUDIO", spec: "7.1 SURROUND", price: "$150.00", icon: "bi-headphones", code: "A07" }
            ];

            const productosPractica = [
                { id: 5, title: "DRILL 18V", spec: "POWER TORQUE", price: "$249.99", icon: "bi-nut", code: "T18" },
                { id: 6, title: "AMBI-LIGHT", spec: "SMART WIFI", price: "$169.99", icon: "bi-lightbulb", code: "L04" },
                { id: 7, title: "LASER MEASURE", spec: "METRIC X4", price: "$89.50", icon: "bi-bounding-box-circles", code: "L88" },
                { id: 8, title: "TOOLBOX EVO", spec: "IMPACT SHIELD", price: "$120.00", icon: "bi-box-seam", code: "B05" }
            ];

            return (
                <div class="w-full h-full flex flex-col relative bg-slate-950">
                    
                    {/* HEADER FIJO */}
                    <header class="h-16 w-full flex items-center justify-between px-4 bg-slate-950 border-b border-white/10 z-50">
                        <div class="flex items-center space-x-2">
                            <i class="bi bi-list text-xl text-white"></i>
                            <span class="text-sm font-bold tracking-tight font-space text-white">GONMO NAVE</span>
                        </div>
                        <i class="bi bi-search text-lg text-white opacity-80"></i>
                    </header>

                    {/* INTERFAZ DUAL CON CONTENEDORES DE INTERACCIÓN PROPIA */}
                    <main class="flex-1 w-full flex relative overflow-hidden">
                        
                        {/* COLUMNA IZQUIERDA: ZONA ALPHA (SILICIO + SCROLL PROPIO) */}
                        <div class="w-1/2 col-nave silicon-bg px-2 py-4 border-r border-white/10">
                            <div class="mb-4 text-center border-b border-cyan-500/30 pb-2 sticky top-0 bg-[#0b132b]/90 backdrop-blur-xs z-20 rounded-b-lg">
                                <h2 class="text-[11px] font-black font-space tracking-widest text-cyan-400">// ZONA ALPHA</h2>
                            </div>
                            <div class="space-y-4">
                                {productosAlpha.map(p => (
                                    <div key={p.id} class="silicon-card rounded-2xl p-3 flex flex-col justify-between h-[210px]">
                                        <div class="w-full h-24 rounded-xl flex flex-col items-center justify-center relative bg-slate-950/40 border border-cyan-500/10">
                                            <i class={`bi ${p.icon} text-3xl text-cyan-400 opacity-90 animate-pulse`}></i>
                                            <span class="absolute bottom-1 right-2 text-[8px] font-bold font-space text-cyan-400/30 tracking-widest">{p.code}</span>
                                        </div>
                                        <div class="mt-2">
                                            <h3 class="text-xs font-black tracking-tight text-white leading-none uppercase truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-cyan-400/80 tracking-wider uppercase mt-1">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2 pt-1 border-t border-white/5">
                                            <span class="text-xs font-black font-space text-white tracking-tight">{p.price}</span>
                                            <button class="w-7 h-7 rounded-full bg-cyan-400 text-slate-950 flex items-center justify-center shadow-md active:scale-90 transition-transform">
                                                <i class="bi bi-lightning-charge-fill text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* COLUMNA DERECHA: ZONA PRÁCTICA (BLUEPRINT + SCROLL PROPIO) */}
                        <div class="w-1/2 col-nave blueprint-bg px-2 py-4">
                            <div class="mb-4 text-center border-b border-slate-950/20 pb-2 sticky top-0 bg-[#F4D03F]/90 backdrop-blur-xs z-20 rounded-b-lg">
                                <h2 class="text-[11px] font-black font-space tracking-widest text-slate-950">// ZONA PRÁCTICA</h2>
                            </div>
                            <div class="space-y-4">
                                {productosPractica.map(p => (
                                    <div key={p.id} class="bg-white border border-slate-300/60 rounded-2xl p-3 flex flex-col justify-between h-[210px] shadow-xl">
                                        <div class="w-full h-24 rounded-xl flex flex-col items-center justify-center relative bg-slate-100">
                                            <i class={`bi ${p.icon} text-3xl text-slate-950 opacity-80`}></i>
                                            <span class="absolute bottom-1 right-2 text-[8px] font-bold font-space text-slate-950/20 tracking-widest">{p.code}</span>
                                        </div>
                                        <div class="mt-2">
                                            <h3 class="text-xs font-black tracking-tight text-slate-950 leading-none uppercase truncate">{p.title}</h3>
                                            <p class="text-[8px] font-bold text-amber-600 tracking-wider uppercase mt-1">{p.spec}</p>
                                        </div>
                                        <div class="flex items-center justify-between mt-2 pt-1 border-t border-slate-100">
                                            <span class="text-xs font-black font-space text-slate-950 tracking-tight">{p.price}</span>
                                            <button class="w-7 h-7 rounded-full bg-slate-950 text-white flex items-center justify-center shadow-md active:scale-90 transition-transform">
                                                <i class="bi bi-lightning-charge-fill text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* CENTRAL EJE: ASTRO-GONMO */}
                        <div class="astro-center pointer-events-none">
                            <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-cyan-400 to-sky-600 border-2 border-slate-950 shadow-2xl flex items-center justify-center pointer-events-auto cursor-pointer glow-avatar transform active:scale-95 transition-transform">
                                <i class="bi bi-robot text-slate-950 text-base"></i>
                            </div>
                        </div>

                    </main>

                    {/* FOOTER BAR COMERCIAL */}
                    <nav class="h-16 w-full bg-slate-950 border-t border-white/10 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center text-cyan-400">
                            <i class="bi bi-grid-1x2-fill text-base"></i>
                            <span class="text-[8px] font-bold tracking-wider mt-0.5 font-space">NAVE</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="bi bi-person text-base"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="bi bi-bell text-base"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">AVISOS</span>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveSplit />);
    </script>
</body>
</html>
