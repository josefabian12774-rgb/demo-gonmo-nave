<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GONMO NAVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #02040a; color: white; overflow: hidden; }
        .logo-glow { filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.6)); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div className="h-screen w-full flex flex-col">
                    {/* Header con el logo centrado y menú lateral */}
                    <header className="h-16 flex items-center justify-between px-4 border-b border-white/10">
                        <i className="bi bi-list text-2xl"></i>
                        <img src="./logo.JPG" alt="GonMo" className="h-10 w-10 rounded-lg logo-glow" />
                        <i className="bi bi-search text-xl"></i>
                    </header>

                    {/* Área principal con el robot */}
                    <main className="flex-1 relative flex flex-col items-center pt-10">
                        <h1 className="text-white font-bold text-xl mb-4 text-center">GONMO NAVE</h1>
                        
                        {/* Robot en el centro */}
                        <div className="w-40 h-40 bg-slate-800 rounded-full flex items-center justify-center mb-10 border border-cyan-500/50">
                            <i className="bi bi-robot text-6xl text-cyan-400"></i>
                        </div>

                        {/* Sectores */}
                        <div className="flex w-full px-4 gap-4">
                            <div className="flex-1 h-32 bg-slate-900 border border-cyan-900 rounded-xl flex items-center justify-center">
                                <span className="text-cyan-400 font-bold text-xs">// SILICIO ALPHA</span>
                            </div>
                            <div className="flex-1 h-32 bg-yellow-500 rounded-xl flex items-center justify-center">
                                <span className="text-slate-900 font-bold text-xs">// SILICIO PRÁCTICA</span>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
