<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GONMO NAVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #030712; color: white; overflow: hidden; font-family: sans-serif; }
        .col-nave { height: calc(100vh - 128px); overflow-y: scroll; scroll-behavior: smooth; padding-top: 24px; }
        .col-nave::-webkit-scrollbar { display: none; }
        .hologram-robot { filter: drop-shadow(0 0 15px #06b6d4); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <div id="root" class="w-full h-full"></div>
    <script type="text/babel">
        function App() {
            return (
                <div className="w-full h-screen flex flex-col">
                    {/* Header con Logo centrado */}
                    <header className="h-16 flex items-center justify-between px-4 border-b border-white/10 bg-slate-950 z-50">
                        <i className="bi bi-list text-2xl"></i>
                        <img src="./logo.JPG" alt="Logo" className="h-10 w-10 rounded-lg border border-cyan-500/30" />
                        <i className="bi bi-search text-xl"></i>
                    </header>

                    <main className="flex-1 flex relative">
                        {/* Columnas */}
                        <div className="w-1/2 col-nave bg-[#060b19] border-r border-white/10 p-2">
                            <h2 className="text-center text-cyan-400 font-bold text-[10px] mb-4">// SILICIO ALPHA</h2>
                            <div className="h-32 border border-cyan-500/30 rounded-xl mb-4 bg-slate-900/50"></div>
                            <div className="h-32 border border-cyan-500/30 rounded-xl bg-slate-900/50"></div>
                        </div>
                        <div className="w-1/2 col-nave bg-yellow-500 p-2">
                            <h2 className="text-center text-slate-900 font-bold text-[10px] mb-4">// SILICIO PRÁCTICA</h2>
                            <div className="h-32 border border-slate-900/20 rounded-xl mb-4 bg-white"></div>
                            <div className="h-32 border border-slate-900/20 rounded-xl bg-white"></div>
                        </div>

                        {/* Robot en el medio */}
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-40 hologram-robot">
                            <i className="bi bi-robot text-6xl text-cyan-400"></i>
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="h-16 flex items-center justify-around border-t border-white/10 bg-slate-950">
                        <div className="flex flex-col items-center"><i className="bi bi-cart"></i><span className="text-[10px]">CARRITO</span></div>
                        <div className="flex flex-col items-center"><i className="bi bi-person"></i><span className="text-[10px]">PERFIL</span></div>
                        <div className="flex flex-col items-center"><i className="bi bi-bell"></i><span className="text-[10px]">ALERTAS</span></div>
                    </footer>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
