<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GONMO NAVE — NEXO ARQUETIPO V1.4</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b132b;
            margin: 0;
            padding: 0;
        }
        .font-space { font-family: 'Space Grotesk', sans-serif; }
        
        /* Ajuste fino para evitar colisiones visuales con la barra fija */
        .scroller-content {
            padding-top: 64px;
            padding-bottom: 80px;
        }
    </style>
</head>
<body class="antialiased text-white selection:bg-cyan-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        function GonmoNaveApp() {
            // Estructura limpia de datos unificada para renderizado continuo
            const secciones = [
                {
                    id: "ALPHA",
                    titulo: "// ZONA ALPHA",
                    subtitulo: "HARDWARE & GAMING COMPONENTES",
                    bgClase: "bg-[#0b132b] text-white",
                    cardClase: "bg-[#111c3a]/90 border-white/10 text-white",
                    accentText: "text-cyan-400",
                    btnClase: "bg-white text-slate-950 hover:bg-cyan-400",
                    productos: [
                        { id: 1, title: "NIGHTHAWK 18K", spec: "PRD-OPTIC SENSOR", detail: "Resolución de 18K DPI nativos de respuesta inmediata.", price: "$189.99", icon: "bi-mouse3-fill", code: "M01" },
                        { id: 2, title: "ASUS ROG TITAN", spec: "12GB GDDR6 VRAM", detail: "Arquitectura de última generación con soporte Ray Tracing activo.", price: "$1,299.99", icon: "bi-gpu-card", code: "G12" }
                    ]
                },
                {
                    id: "PRACTICA",
                    titulo: "// ZONA PRÁCTICA",
                    subtitulo: "HERRAMIENTAS & HOGAR UTILITARIO",
                    bgClase: "bg-[#F4D03F] text-slate-950",
                    cardClase: "bg-white border-slate-300/60 text-slate-950 shadow-md",
                    accentText: "text-amber-600",
                    btnClase: "bg-slate-950 text-white hover:bg-amber-500 hover:text-slate-950",
                    productos: [
                        { id: 3, title: "POWER-DRILL 18V", spec: "TEOMKL 33SO H3", detail: "Motor industrial de torque masivo para entornos demandantes.", price: "$249.99", icon: "bi-nut-fill", code: "T18", tag: "PRO" },
                        { id: 4, title: "PHILIPS AMBI-LIGHT", spec: "🌐 SMART WIFI CONTROL", detail: "Iluminación ambiental de alta fidelidad con presets automatizados.", price: "$169.99", icon: "bi-lightbulb-fill", code: "L04", tag: "WIFI" }
                    ]
                }
            ];

            return (
                <div class="w-screen min-h-screen flex flex-col relative overflow-x-hidden">
                    
                    {/* HEADER PREMIUM BLUR */}
                    <header class="fixed top-0 inset-x-0 h-16 flex items-center justify-between px-6 bg-slate-950/80 backdrop-blur-md border-b border-white/10 z-50">
                        <div class="flex items-center space-x-3">
                            <i class="bi bi-list text-xl opacity-80 cursor-pointer"></i>
                            <span class="text-base font-bold tracking-tight font-space uppercase text-white">GONMO NAVE</span>
                        </div>
                        <div class="flex items-center space-x-5 text-lg text-white opacity-90">
                            <i class="bi bi-search cursor-pointer"></i>
                            <div class="relative cursor-pointer">
                                <i class="bi bi-cart3"></i>
                                <span class="absolute -top-1.5 -right-2 bg-red-500 text-white font-bold text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-space">3</span>
                            </div>
                        </div>
                    </header>

                    {/* FLUJO CONTINUO VERTICAL (ESTILO MATRIZ NORTE REAL) */}
                    <div class="scroller-content w-full flex flex-col">
                        {secciones.map((sec) => (
                            <section key={sec.id} class={`w-full py-8 px-5 transition-colors duration-300 ${sec.bgClase}`}>
                                <div class="max-w-md mx-auto w-full">
                                    
                                    {/* CABECERA DE LA ZONA */}
                                    <div class="mb-6 border-b border-current/10 pb-2">
                                        <h2 class="text-xl font-black font-space tracking-wider uppercase leading-none">{sec.titulo}</h2>
                                        <p class="text-[10px] font-bold tracking-widest uppercase opacity-70 mt-1">{sec.subtitulo}</p>
                                    </div>

                                    {/* LISTA DE TARJETAS */}
                                    <div class="space-y-5">
                                        {sec.productos.map((item) => (
                                            <div key={item.id} class={`rounded-2xl p-5 flex items-center justify-between shadow-xl border transition-all ${sec.cardClase}`}>
                                                
                                                {/* INFO DEL PRODUCTO */}
                                                <div class="w-[62%] flex flex-col justify-between pr-2">
                                                    <div>
                                                        <div class="flex items-center space-x-2 mb-1">
                                                            <h3 class="text-base font-extrabold tracking-tight leading-tight">{item.title}</h3>
                                                            {item.tag && (
                                                                <span class="bg-amber-500/20 text-amber-900 text-[8px] font-black px-1.5 py-0.5 rounded border border-amber-500/30 font-space uppercase">
                                                                    {item.tag}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <p class={`text-[9px] font-bold tracking-wider uppercase ${sec.accentText}`}>
                                                            {item.spec}
                                                        </p>
                                                        <p class="text-xs mt-2 leading-relaxed opacity-80">
                                                            {item.detail}
                                                        </p>
                                                    </div>
                                                    
                                                    <div class="mt-4 flex items-center justify-between">
                                                        <span class="text-base font-black font-space tracking-tight">
                                                            {item.price}
                                                        </span>
                                                        <button class={`w-9 h-9 rounded-full flex items-center justify-center shadow-md transition-transform active:scale-95 ${sec.btnClase}`}>
                                                            <i class="bi bi-lightning-charge-fill text-xs"></i>
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* PLACEHOLDER REPOSITORIO PREMIUM (ESTILIZADO SIN LINKS ROTOS) */}
                                                <div class="w-[35%] h-32 rounded-xl flex flex-col items-center justify-center relative bg-slate-950/5 border border-current/5">
                                                    <i class={`bi ${item.icon} text-3xl mb-1 opacity-60`}></i>
                                                    <span class="text-[9px] font-black font-space tracking-widest opacity-40 select-none">
                                                        {item.code}
                                                    </span>
                                                </div>

                                            </div>
                                        ))}
                                    </div>

                                </div>
                            </section>
                        ))}
                    </div>

                    {/* ASISTENTE VIRTUAL CONTROLADO (EN ESQUINA SIN OBSTRUIR TEXTO) */}
                    <div class="fixed bottom-20 right-4 flex items-center space-x-2 z-40 pointer-events-none">
                        <div class="bg-slate-950/95 backdrop-blur-md border border-white/10 text-white rounded-xl px-3 py-1.5 text-[10px] max-w-[160px] shadow-2xl pointer-events-auto">
                            <p class="font-bold text-cyan-400 text-[8px] font-space tracking-widest uppercase mb-0.5">ASTRO // NAVE</p>
                            <p class="text-slate-300 leading-tight">Scroll unificado en vertical listo, Fabián.</p>
                        </div>
                        
                        {/* Esfera Estilizada Compacta */}
                        <div class="w-12 h-12 rounded-full relative pointer-events-auto shadow-xl bg-gradient-to-tr from-cyan-600 via-sky-400 to-white border border-white/20 animate-pulse">
                            <div class="absolute inset-2 rounded-full bg-slate-950/40 backdrop-blur-xs flex items-center justify-center">
                                <i class="bi bi-robot text-white text-base opacity-90"></i>
                            </div>
                        </div>
                    </div>

                    {/* BARRA COMERCIAL INFERIOR FIJA */}
                    <nav class="fixed bottom-0 inset-x-0 h-16 bg-slate-950/90 backdrop-blur-md border-t border-white/10 flex items-center justify-around text-slate-400 z-50">
                        <div class="flex flex-col items-center cursor-pointer text-cyan-400">
                            <i class="bi bi-grid-1x2-fill text-lg"></i>
                            <span class="text-[8px] font-bold tracking-wider mt-0.5 font-space">NAVE</span>
                        </div>
                        <div class="flex flex-col items-center cursor-pointer hover:text-white transition-colors">
                            <i class="bi bi-person text-lg"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">PERFIL</span>
                        </div>
                        <div class="flex flex-col items-center cursor-pointer hover:text-white transition-colors">
                            <i class="bi bi-bell text-lg"></i>
                            <span class="text-[8px] font-medium tracking-wider mt-0.5">NOTIFICACIONES</span>
                        </div>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GonmoNaveApp />);
    </script>
</body>
</html>
