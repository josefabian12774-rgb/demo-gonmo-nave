            overflow-x: hidden;

        .font-space { font-family: 'Space Grotesk', sans-serif; }
        
        /* Esfera 3D Premium con degradados puros CSS */
        .sphere-3d {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e0f2fe, #38bdf8 40%, #0284c7 70%, #0369a1 100%);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 15px 30px rgba(14, 165, 233, 0.4);
            position: relative;
        }
        .sphere-core {
            position: absolute;
            top: 25%;
            left: 25%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #ffffff, #22d3ee 60%, #0891b2 100%);
            box-shadow: 0 0 15px #22d3ee;
        }
